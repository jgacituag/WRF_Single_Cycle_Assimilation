# build_3D_section_post.yaml
# Config for extracting a 3D subset from postprocessed CF-convention files.
# File naming pattern: WRF.D{date}.T3D.M{member}.nc

cross_sections_job:
  format: post      # plain netCDF4, no wrf-python needed

  # ---- dataset identity, written into every subset ----
  # Multi-physics despite the SINGLECONF-era directory name, 4 km, 1 h DA cycle.
  # dataset_id is checked against the output path by src/naming.py and is
  # never parsed back out of the filename.
  dataset_id:   B
  physics:      multi      # multi | single
  da_cycle_min: 60        # upstream DA cycle length [min]
  upstream:     GUES     # which POST tree the prior came from
  # config_index: [...]   # per-member physics configuration, 60 entries.
  #   Omitted = unrecoverable for this dataset; the subset then carries an
  #   all -1 array plus a note saying so. Do not invent it.

  paths:
    pattern:   "/home/jruiz/datosdemerzel/PREVENIR_LOWRESOLUTION_DA_FUGAKU_2024031900/POST/GUES/{init}/WRF.D{date}.T3D.M{member}.nc"
    output:    "/nfsmounts/munin/datos/jorge.gacitua/WRF_Single_Cycle_Assimilation/data/3D_subsets_B/subset_B_{date}.npz"
    date_fmt:  "%Y%m%d%H%M%S"        # -> 20240320180000
    start:     "20240320060000"       # fixed init time for this job
    init_date: "2024-03-20_06:00:00"
    end_date:  "2024-03-20_06:00:00"
    freq:      "1H"

  ensemble:
    mem_ini: 1
    mem_end: 60
    pad:     3      # member strings: 001, 002, ..., 060

  subset_3d:
    # No timeidx needed — postprocessed files have exactly one time step
    k_start: 0      # vertical level start (null = 0, i.e. lowest level)
    k_end:   -1      # vertical level end, a Python slice end: -1 -> slice(0, -1), which
                     # drops the last POST level (14 km); null would keep every level
    j_start: 222      # south-north start
    j_end:   673      # south-north end
    i_start: 140      # west-east start
    i_end:   447      # west-east end
